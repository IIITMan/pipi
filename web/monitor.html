<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>皮皮 · 生命监控台</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#0f1220;--card:#1a1f33;--line:#2a3150;--txt:#e8ebf7;--dim:#8b93b8;
        --pink:#ff7eb6;--blue:#6ea8ff;--green:#7ee2a8;--yellow:#ffd479}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--txt);font-family:"Microsoft YaHei",system-ui,sans-serif;
       padding:10px 14px;display:flex;flex-direction:column;font-size:13px}
  h1{font-size:18px;margin:0}
  .sub{color:var(--dim);font-size:12px;margin-top:3px}
  #conn{display:inline-block;width:8px;height:8px;border-radius:50%;background:#e05555;
        margin-right:6px;vertical-align:middle}
  #conn.on{background:var(--green)}

  /* ===== 满屏三栏网格：左(摄像头+眼睛) / 中(聊天+记录) / 右(心情+心搏+成长+提醒) ===== */
  .layout{display:grid;grid-template-columns:minmax(270px,340px) minmax(0,1fr) minmax(270px,330px);
          gap:12px;flex:1;min-height:0;margin-top:12px}
  .col{display:flex;flex-direction:column;gap:12px;min-height:0}
  .col-right{overflow-y:auto}                 /* 右列信息多：内部滚动，不动整页 */
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
        padding:10px 12px;min-height:0;display:flex;flex-direction:column}
  .card h2{font-size:13px;color:var(--dim);font-weight:normal;margin-bottom:8px}

  /* ---- 摄像头（预留画面位） ---- */
  .cam-box{position:relative;aspect-ratio:16/9;background:#0b0e1a;
           border:1px dashed var(--line);border-radius:10px;overflow:hidden;
           display:flex;align-items:center;justify-content:center}
  .cam-ph{color:var(--dim);font-size:12px;text-align:center;line-height:1.6}
  .cam-box video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

  /* ---- 眼睛 ---- */
  .face{flex:1;min-height:0}
  .facebox{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;min-height:0}
  #face{width:100%;height:auto;max-height:200px;flex:1;min-height:90px}
  .eye{fill:#7cc4f8;transition:all .3s ease}
  .eyes-speaking{animation:talk .5s ease-in-out infinite alternate;transform-origin:center}
  @keyframes talk{from{transform:scaleY(1)}to{transform:scaleY(.72)}}
  #activity{width:100%;background:#10131f;border-radius:10px;padding:6px 10px;
            font-size:12.5px;line-height:1.6;text-align:center}
  #activity .now{color:var(--green)}
  #activity .intent{color:var(--dim);font-style:italic}
  #tears .tear{animation:fall 1.3s ease-in infinite}
  #tears .t2{animation-delay:.35s} #tears .t4{animation-delay:.45s}
  #tears .t3{animation-delay:.7s}
  @keyframes fall{0%{transform:translateY(0);opacity:0}25%{opacity:1}
                  100%{transform:translateY(30px);opacity:0}}
  .badge{padding:2px 12px;border-radius:999px;font-size:12.5px;background:#2a3150}
  .badges{display:flex;gap:6px;justify-content:center;align-items:center}
  #lastThought{font-size:12px;color:var(--dim);text-align:center;min-height:16px}

  /* ---- 三轴状态 ---- */
  .stat{margin:8px 0}
  .stat .lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--dim)}
  .bar{height:6px;background:#10131f;border-radius:6px;overflow:hidden;margin-top:3px}
  .bar i{display:block;height:100%;border-radius:6px;transition:width .5s}
  .mood-bar i{background:linear-gradient(90deg,#6ea8ff,#ff7eb6)}
  #summary{font-size:12.5px;background:#10131f;border-radius:10px;padding:6px 10px;
           text-align:center;line-height:1.5}
  .meta{font-size:12px;color:var(--dim);margin-top:6px;text-align:center}

  /* ---- 心搏 / 成长 / 提醒 ---- */
  #pulseCard,#growthCard,#remindersCard{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
  .pl{font-size:12px;line-height:1.9}
  .cap{display:inline-block;margin-right:8px;font-size:12px}
  .cap.on{color:var(--green)}
  .cap.off{color:var(--dim)}
  #pSeed{font-size:11px;color:var(--dim)}
  #growthStage{font-size:12.5px;margin-bottom:3px}
  #growthGap{font-size:12px;color:var(--dim)}
  #growthMs{font-size:12px;margin-top:5px;line-height:1.7}
  #growthExpr{font-size:12px;color:var(--dim);margin-top:3px}
  #remindersList{font-size:12px;line-height:1.7}
  #remindersNext{font-size:12px;color:var(--dim);margin-top:3px}

  /* ---- 聊天 / 心理记录（等分，内部滚动） ---- */
  .col-mid{display:grid;grid-template-rows:1fr 1fr;gap:12px;min-height:0}
  .log{flex:1;min-height:0;overflow-y:auto}
  #chat,#life{font-size:12.5px}
  .evt{padding:4px 8px;border-radius:8px;font-size:12.5px;margin-bottom:3px;line-height:1.5}
  .evt .t{color:var(--dim);font-size:11px;margin-right:6px}
  .evt.user{background:#20305c}
  .evt.pipi{background:#3a2547}
  .evt.inner{background:#1d2438;color:var(--dim);font-style:italic}
  .evt.action{background:#1d3328;color:var(--green)}
  .evt.sys{background:#2a2438;color:var(--yellow)}
  .chatbox{display:flex;gap:8px;margin-top:8px}
  .chatbox input{flex:1;background:#10131f;border:1px solid var(--line);border-radius:10px;
                 color:var(--txt);padding:7px 12px;font-size:13px;outline:none}
  .chatbox input:focus{border-color:var(--blue)}
  .chatbox button{background:#2a3150;border:none;border-radius:10px;color:var(--txt);
                  padding:7px 16px;cursor:pointer;font-size:13px}
  .chatbox button:hover{background:#3a4468}
  .typing{color:var(--dim);font-style:italic;font-size:12.5px;padding:4px 8px}

  /* ===== 分辨率适配 =====
   * 默认(≥1440px)：1920×1080 宽松档，内容用足高度、卡片内部滚动。
   * ≤1440px（覆盖 1366×768）：紧凑档，缩小间距/字号，保证一屏放下。 */
  @media (max-width:1440px){
    body{padding:8px 10px;font-size:12.5px}
    .layout{gap:10px;margin-top:10px;
            grid-template-columns:minmax(250px,300px) minmax(0,1fr) minmax(250px,290px)}
    .card{padding:8px 10px;border-radius:10px}
    .card h2{font-size:12.5px;margin-bottom:6px}
    #face{max-height:150px;min-height:70px}
    .cam-ph{font-size:11px}
    #activity{font-size:12px;padding:5px 8px}
    .evt{padding:3px 6px;font-size:12px}
    .chatbox input{padding:6px 10px;font-size:12.5px}
    .chatbox button{padding:6px 12px;font-size:12.5px}
  }
  @media (max-width:1100px){           /* 小窗口兜底：单列滚动 */
    html,body{height:auto;overflow:auto}
    body{display:block}
    .layout{grid-template-columns:1fr;overflow:visible}
    .col{overflow:visible}
    .col-right{overflow:visible}
    .col-mid{display:flex}
    .log{max-height:320px}
    .face{min-height:200px}
    #face{min-height:120px;max-height:180px}
  }
</style>
</head>
<body>
<h1>🫀 皮皮 · 生命监控台</h1>
<div class="sub">
  <span id="conn"></span><span id="connText">连接中…</span>
  ｜ 静态页面 + WebSocket 订阅，无需启动任何服务 —— 双击本文件即可使用
</div>

<div class="layout">
  <!-- 左列：摄像头（预留）+ 眼睛 -->
  <div class="col">
    <div class="card">
      <h2>📷 摄像头 <span style="color:var(--dim)">（实时画面 · 仅本地网络 · 不落盘）</span></h2>
      <div class="cam-box">
        <video id="camFeed" hidden></video>
        <img id="camImg" hidden alt=""
             style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">
        <div class="cam-ph">等待窗口进程推流…<br>（启动 run.py --voice 后自动显示）</div>
      </div>
    </div>
    <div class="card face">
      <h2>眼睛</h2>
      <div class="facebox">
        <svg id="face" viewBox="0 0 260 160">
          <g id="eyes">
            <path id="eyeL" class="eye" d=""/>
            <path id="eyeR" class="eye" d=""/>
          </g>
          <text id="zzz" x="196" y="42" fill="#8b93b8" font-size="20" font-style="italic" opacity="0">z Z</text>
          <g id="tears" style="display:none">
            <ellipse class="tear" cx="68" cy="102" rx="5" ry="8" fill="#6ec6ff"/>
            <ellipse class="tear t2" cx="82" cy="102" rx="4" ry="6.5" fill="#6ec6ff"/>
            <ellipse class="tear t3" cx="178" cy="102" rx="5" ry="8" fill="#6ec6ff"/>
            <ellipse class="tear t4" cx="192" cy="102" rx="4" ry="6.5" fill="#6ec6ff"/>
          </g>
        </svg>
        <div class="badges">
          <span id="stateBadge" class="badge">-</span>
          <span id="attBadge" class="badge" style="font-size:11.5px">-</span>
        </div>
        <div id="activity">
          <div class="now">…</div>
          <div class="intent"></div>
        </div>
        <div id="lastThought"></div>
      </div>
    </div>
  </div>

  <!-- 中列：聊天 + 心理记录 -->
  <div class="col-mid">
    <div class="card">
      <h2>聊天（远程文字，与语音共享记忆）</h2>
      <div id="chat" class="log"></div>
      <div class="chatbox">
        <input id="chatInput" placeholder="打字和皮皮聊两句…（语音对话时会被礼貌拒绝）" maxlength="200">
        <button id="chatSend">发送</button>
      </div>
    </div>
    <div class="card">
      <h2>心理与行为记录</h2>
      <div id="life" class="log"></div>
    </div>
  </div>

  <!-- 右列：心情 / 心搏 / 成长 / 提醒 -->
  <div class="col col-right">
    <div class="card">
      <h2>心情与状态</h2>
      <div id="stats"></div>
      <div id="summary">…</div>
      <div class="meta">念头队列 <span id="queue">0</span> · 后端 <span id="backend">-</span></div>
      <div id="pulseCard" style="display:none">
        <h2 style="margin-bottom:4px">🫀 心搏（PULSE）</h2>
        <div class="pl">
          <div>呼吸 <span id="pBreath">-</span> · 天气 <span id="pWeather">-</span>
              · 外面 <span id="pExtWeather" style="color:var(--dim)">—</span>
              <span id="pOwner" style="color:var(--dim)"></span></div>
          <div>对话心情 <span id="pChatMood" style="color:var(--dim)">—</span>
              <span id="pPhase" style="color:var(--dim)"></span></div>
          <div>身体 <span id="pBody" style="color:var(--dim)">—</span></div>
          <div>行为 <span id="pBehavior" style="color:var(--dim)">—</span></div>
          <div>信任 <span id="pTrust">-</span> · 自我深度 <span id="pDepth">-</span>
              · 挣扎 <span id="pStruggle">-</span></div>
          <div id="pSeed"></div>
        </div>
      </div>
      <div id="growthCard" style="display:none">
        <h2 style="margin-bottom:4px">🌱 成长</h2>
        <div id="growthStage"></div>
        <div id="growthGap"></div>
        <div id="growthMs"></div>
        <div id="growthExpr"></div>
      </div>
      <div id="remindersCard" style="display:none">
        <h2 style="margin-bottom:4px">⏰ 提醒 / 待办</h2>
        <div id="remindersList"></div>
        <div id="remindersNext"></div>
      </div>
      <div id="envCard" style="display:none">
        <h2 style="margin-bottom:4px">🏠 环境档案 <span style="color:var(--dim)">（贾维斯感③：它眼里的家）</span></h2>
        <div class="pl">
          <div id="envOwner" style="color:var(--green)"></div>
          <div id="envFacts" style="color:var(--dim);margin-top:3px"></div>
          <div id="envCaps" style="margin-top:5px"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const kk = v => v.toFixed(1);

/* ================= 英文状态 → 中文（页面只显示中文） ================= */
const STATE_ZH = {idle:"空闲", rest:"休息", chatting:"对话中", muttering:"嘀咕中"};
const ATT_ZH   = {focus:"专注", rest:"休息", wandering:"发呆"};
const MOTION_ZH = {approach:"靠近", retreat:"退后", look:"看向",
                   explore:"探索", idle:"原地"};
const TARGET_ZH = {owner:"主人", door:"门口", sound:"声源",
                   threat:"威胁处", none:"无"};
const BACKEND_ZH = {pulse:"心搏引擎", legacy:"旧版引擎"};
const zh = (m, k) => (k in m ? m[k] : k);   // 未知值原样显示，不吞

/* ================= WebSocket 订阅 =================
 * file:// 打开 → 连 ws://127.0.0.1:8848/ws
 * http(s) 托管 → 连同源
 * 断线自动重连（1s）。
 */
const WS_URL = location.protocol === "file:"
  ? "ws://127.0.0.1:8848/ws"
  : `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`;

let ws = null, connected = false;
let logBuf = [], chatBuf = [];

function setConn(on, text){
  connected = on;
  $("conn").className = on ? "on" : "";
  $("connText").textContent = text;
}
function connect(){
  try{ ws = new WebSocket(WS_URL); }catch(e){ setConn(false, "连接失败，1s 后重试"); return setTimeout(connect, 1000); }
  ws.onopen = () => setConn(true, "已连接（" + WS_URL + "）");
  ws.onclose = () => { setConn(false, "连接断开，1s 后重连（窗口端没开？）"); setTimeout(connect, 1000); };
  ws.onerror = () => ws.close();
  ws.onmessage = ev => {
    let m; try{ m = JSON.parse(ev.data); }catch(e){ return; }
    if (m.type === "backfill"){
      logBuf = m.log || []; chatBuf = m.chat || [];
      if (m.snapshot) applySnapshot(m.snapshot);
      renderLog(); renderChat();
    } else if (m.type === "snapshot"){ applySnapshot(m.data); }
    else if (m.type === "event"){ logBuf.push(m.data); if(logBuf.length>300) logBuf.shift(); renderLog(); }
    else if (m.type === "chat"){ chatBuf.push(m.data); if(chatBuf.length>100) chatBuf.shift(); $("typing")?.remove(); renderChat(); }
    else if (m.type === "camera"){
      const img = document.getElementById("camImg");
      const ph = document.querySelector(".cam-ph");
      if (img){ img.src = m.data; img.hidden = false; }
      if (ph){ ph.style.display = "none"; }
    }
    else if (m.type === "thinking"){ showTyping(); }
    else if (m.type === "busy"){ $("typing")?.remove(); showNote(m.data && m.data.reason || "忙"); }
  };
}
connect();

/* ================= 摄像头接入点（预留） =================
 * 后期接硬件后：
 *   camFeed.srcObject = stream;      // 或 camFeed.src = "rtsp://…"
 *   camFeed.hidden = false;          // 隐藏占位框
 * 占位文字与虚线框由 CSS 自动让位（video 绝对定位盖住）。
 */

/* ================= 三轴状态条 ================= */
const STATS = [
  ["mood","心情 (-5~+5)","#ff7eb6",5],
  ["energy","精力","#ffd479",10],
  ["social","想陪","#b48cff",10],
];
function renderStats(p){
  const el = $("stats");
  if (!el.dataset.built){
    el.innerHTML = STATS.map(([k,label,color]) => `
      <div class="stat"><div class="lbl"><span>${label}</span><span id="v-${k}">-</span></div>
      <div class="bar ${k==='mood'?'mood-bar':''}"><i id="b-${k}" style="background:${color}"></i></div></div>`).join("");
    el.dataset.built = 1;
  }
  for (const [k,,color,max] of STATS){
    $("v-"+k).textContent = kk(p[k]);
    const b = $("b-"+k);
    b.style.background = color;
    b.style.width = Math.abs(p[k])/max*100 + "%";
  }
  $("summary").textContent = p.summary || "";
}
function applySnapshot(s){
  renderStats(s.physio); renderFace(s); renderActivity(s.activity);
  renderGrowth(s.growth); renderReminders(s.reminders); renderPulse(s.pulse);
  renderEnv(s.env);
  $("queue").textContent = s.queue;
  $("backend").textContent = zh(BACKEND_ZH, s.action_backend);
  $("lastThought").textContent = s.last_thought ? "最近念头：" + s.last_thought : "";
}
const SEED_AXES = [["boldness","胆识"],["curiosity","好奇"],["clinginess","依恋"],
                   ["sensitivity","敏感"],["reactivity","应激"]];
function renderPulse(p){
  const card = $("pulseCard");
  if (!p){ card.style.display = "none"; return; }
  card.style.display = "";
  $("pBreath").textContent = `${p.breath.rate.toFixed(0)} 次/分 · 深度 ${p.breath.depth.toFixed(2)}`;
  $("pWeather").textContent = `${p.weather.label}${p.sleeping ? "（睡着了）" : ""}`;
  $("pExtWeather").textContent = p.weather_ext ? p.weather_ext : "—";
  $("pOwner").textContent = p.owner_present ? "· 主人在" : "· 主人不在";
  const moodSign = {"开心":1,"得意":1,"调皮":1,"关心":1,"平静":0,"困倦":-1,
    "傲娇":0,"吃醋":-1,"委屈":-1,"生气":-1}[p.last_chat_mood];
  $("pChatMood").textContent = p.last_chat_mood
    ? `${p.last_chat_mood}${moodSign > 0 ? " 😊" : moodSign < 0 ? " 😞" : ""}` : "—";
  $("pPhase").textContent = p.sess_phase === "LISTEN" ? "· 正在听"
    : p.sess_phase === "RESPOND" ? "· 正在说" : "";
  if (p.body){
    const act = p.body.act ? ` · ${p.body.act}` : "";
    $("pBody").textContent =
      `灯${(p.body.lamp||0).toFixed(2)} · 眼${p.body.eye} · ${p.body.pose}${act}`;
  }
  $("pBehavior").textContent = p.behavior
    ? `${p.behavior.zh}（${zh(MOTION_ZH, p.behavior.motion)}→${zh(TARGET_ZH, p.behavior.target)}）`
    : "—";
  $("pTrust").textContent = p.trust.toFixed(1);
  $("pDepth").textContent = p.self_depth;
  $("pStruggle").textContent = p.struggle.toFixed(2);
  $("pSeed").innerHTML = SEED_AXES.map(([k, zh]) =>
    `<span style="display:inline-block;min-width:118px;margin-right:6px">${zh} ${(p.seed[k]||0).toFixed(2)}</span>`
  ).join("");
}
function renderGrowth(g){
  const card = $("growthCard");
  if (!g || g.enabled === false){ card.style.display = "none"; return; }
  card.style.display = "";
  $("growthStage").innerHTML =
    `🌱 S${g.stage} ${g.stage_name} · 可塑性 ${g.plasticity}（已定型 ${Math.round((1-g.plasticity)*100)}%）`
    + ` · 相识 ${g.stats.active_days} 天 / ${g.stats.turns} 轮`;
  const gap = g.gap || {};
  $("growthGap").textContent = gap.done
    ? "已到最终阶段（成熟）——你把它养大了"
    : `下一阶段 S${gap.next_stage}：还差 ${gap.need_days} 天 / ${gap.need_milestones} 个里程碑`;
  $("growthMs").innerHTML = (g.milestones || []).length
    ? g.milestones.map(m=>{
        const t = new Date(m.created_at*1000).toLocaleDateString("zh",{month:"2-digit",day:"2-digit"});
        return `✨ <b>${m.code}</b> ${m.text} <span style="color:var(--dim)">(${t})</span>`;
      }).join("<br>")
    : "✨ 里程碑：暂无（多陪陪它就会点亮）";
  const ex = Object.entries(g.expressions || {}).sort((a,b)=>b[1]-a[1]).slice(0,4);
  $("growthExpr").textContent = ex.length
    ? "偷学你的话：" + ex.map(([k,c])=>`${k}×${c}`).join("、")
    : "";
}
function renderReminders(r){
  const card = $("remindersCard");
  if (!r){ card.style.display = "none"; return; }
  card.style.display = "";
  const items = r.items || [];
  $("remindersList").innerHTML = items.length
    ? items.map(it=>{
        const when = it.remind_at
          ? new Date(it.remind_at*1000).toLocaleString("zh",{day:"2-digit",hour:"2-digit",minute:"2-digit"})
          : "随时";
        const tag = {reminder:"📌",alarm:"⏰",todo:"✅"}[it.kind] || "•";
        return `${tag} ${it.content} <span style="color:var(--dim)">(${when})</span>`;
      }).join("<br>")
    : "暂无提醒与待办";
  $("remindersNext").textContent = r.next_due
    ? "下次触发：" + new Date(r.next_due*1000).toLocaleString("zh",{hour:"2-digit",minute:"2-digit"})
    : "";
}

/* ================= 环境档案（贾维斯化③，HUD ④） ================= */
function renderEnv(e){
  const card = $("envCard");
  if (!e){ card.style.display = "none"; return; }
  card.style.display = "";
  $("envOwner").innerHTML =
    (e.owner_present ? "🏠 主人在家" : "🌙 主人不在")
    + (e.owner_home_hour != null ? ` · 一般 ${e.owner_home_hour} 点回来` : "")
    + (e.owner_arrivals_today ? ` · 今日回家 ${e.owner_arrivals_today} 次` : "")
    + (e.stranger_today ? ` · 今天陌生人 ${e.stranger_today} 次` : "");
  const rows = [];
  if (e.places && e.places.length) rows.push("📍 " + e.places.join("、"));
  if (e.items && e.items.length) rows.push("🎁 " + e.items.join("、"));
  if (e.people && e.people.length) rows.push("👪 " + e.people.join("、"));
  if (e.weather && e.weather.zh) rows.push("🌦 " + e.weather.zh);
  if (e.reminders && e.reminders.length)
    rows.push("📌 " + e.reminders.map(r=>r.text).join("、"));
  $("envFacts").textContent =
    rows.join(" · ") || "还在慢慢认识这个家……（聊一聊家里的人和东西，它就会记住）";
  const cap = (k, l) =>
    `<span class="cap ${e.online && e.online[k] ? "on" : "off"}">`
    + `${e.online && e.online[k] ? "●" : "○"} ${l}</span>`;
  $("envCaps").innerHTML = cap("search", "搜索") + cap("alerts", "预警")
    + cap("weather", "天气");
}

/* ================= 两只大眼睛：纯色大圆眼，形状即状态 ================= */
const CX = [75, 185], CY = 80;
const circle = (cx, cy, r) =>
  `M ${cx-r} ${cy} a ${r} ${r} 0 1 0 ${2*r} 0 a ${r} ${r} 0 1 0 ${-2*r} 0 Z`;
const SHAPES = {
  normal: (cx, cy) => circle(cx, cy, 32),
  listen: (cx, cy) => circle(cx, cy, 36),
  speak:  (cx, cy) => circle(cx, cy, 32),
  happy:  (cx, cy) => `M ${cx-30} ${cy+14} Q ${cx} ${cy-34} ${cx+30} ${cy+14} Q ${cx} ${cy-12} ${cx-30} ${cy+14} Z`,
  sad:    (cx, cy) => `M ${cx-28} ${cy-6} Q ${cx} ${cy+22} ${cx+28} ${cy-6} Q ${cx+14} ${cy+8} ${cx-28} ${cy-6} Z`,
  closed: (cx, cy) => `M ${cx-28} ${cy} Q ${cx} ${cy+12} ${cx+28} ${cy} Q ${cx} ${cy+5} ${cx-28} ${cy} Z`,
  cry:    (cx, cy) => `M ${cx-28} ${cy-2} Q ${cx} ${cy+16} ${cx+28} ${cy-2} Q ${cx} ${cy+9} ${cx-28} ${cy-2} Z`,
  look:   (cx, cy, dx) => circle(cx + dx, cy, 28),
};
let blinkUntil = 0, lastFace = null;
function draw(shape, cy){
  $("eyeL").setAttribute("d", shape(CX[0], cy));
  $("eyeR").setAttribute("d", shape(CX[1], cy));
}
function renderFace(s){
  const p = s.physio, st = s.state, att = s.attention;
  $("stateBadge").textContent = zh(STATE_ZH, st);
  $("attBadge").textContent = zh(ATT_ZH, att);
  $("eyes").classList.remove("eyes-speaking");
  $("zzz").style.opacity = 0;
  lastFace = s;
  const happy = p.mood > 1.2, sad = p.mood < -1.2;
  const crying = p.mood_value === "委屈" || p.mood_value === "生气"
              || p.mood < -1.8;
  $("tears").style.display = crying ? "" : "none";

  if (crying){                                     // 哭：眯缝 + 泪
    draw(SHAPES.cry, CY);
  } else if (att === "rest" || p.energy < 2.5){    // 困了：闭眼 + Zzz
    draw(SHAPES.closed, CY);
    $("zzz").style.opacity = 1;
  } else if (st === "muttering"){                  // 在说话
    if (happy){ draw(SHAPES.happy, CY); }
    else if (sad){ draw(SHAPES.sad, CY); }
    else {
      draw(SHAPES.speak, CY);
      $("eyes").classList.add("eyes-speaking");
    }
  } else if (st === "chatting"){                   // 在听
    if (happy){ draw(SHAPES.happy, CY); }
    else if (sad){ draw(SHAPES.sad, CY); }
    else { draw(SHAPES.listen, CY); }
  } else if (att === "wandering"){                 // 发呆：左右瞟
    const dx = Math.sin(Date.now()/900) * 14;
    $("eyeL").setAttribute("d", SHAPES.look(CX[0], CY, dx));
    $("eyeR").setAttribute("d", SHAPES.look(CX[1], CY, -dx));
  } else if (happy){                               // 待机开心：笑眼
    draw(SHAPES.happy, CY);
  } else if (sad){                                 // 待机委屈
    draw(SHAPES.sad, CY);
  } else {                                         // 常规待机：大圆眼 + 眨眼
    if (Date.now() < blinkUntil){ draw(SHAPES.closed, CY); }
    else {
      draw(SHAPES.normal, CY);
      if (Math.random() < 0.06) blinkUntil = Date.now() + 250;
    }
  }
}
// 快照 1Hz 才来，眨眼/瞟眼动画用本地时钟持续刷新
setInterval(() => { if (lastFace) renderFace(lastFace); }, 120);

/* ================= 正在做什么 ================= */
function renderActivity(a){
  if (!a) return;
  $("activity").querySelector(".now").textContent = "🤖 " + (a.now || "…");
  $("activity").querySelector(".intent").textContent =
    a.intent ? `心里想着：${a.intent}` : "心里没想什么，很安静";
}

/* ================= 日志 / 聊天 ================= */
const KINDS = {thought:"💭", vocal:"🗣️", muted:"🤫", inner:"🧠", discard:"🗑️",
  cooldown:"⏳", fatigue_mute:"😴", action:"🤖", user_voice:"👂",
  barge_in:"✋", response_done:"✔️", farewell:"👋", whimper:"🐾",
  report_home:"🔔", stranger:"⚠️", weather:"🌦️", reminder:"📌"};
function renderLog(){
  $("life").innerHTML = logBuf.slice(-40).reverse().map(e=>{
    const t = new Date(e.t*1000).toLocaleTimeString("zh",{hour12:false});
    return `<div class="evt ${e.kind==="user_voice"?"user":e.kind==="vocal"?"pipi":
      e.kind==="inner"?"inner":e.kind==="action"?"action":"sys"}">
      <span class="t">${t}</span>${KINDS[e.kind]||"·"} ${e.text}</div>`;
  }).join("") || "<div style='color:var(--dim)'>暂无记录</div>";
}
function renderChat(){
  $("typing")?.remove();
  const items = chatBuf.slice(-40).reverse().map(m=>
    `<div class="evt ${m.role==="user"?"user":"pipi"}">
     <span class="t">${new Date(m.t*1000).toLocaleTimeString("zh",{hour12:false})}</span>
     ${m.role==="user"?"🙂":"皮皮"} ${m.text}</div>`);
  $("chat").innerHTML = (items.length ? items.join("") :
    "<div style='color:var(--dim)'>暂无对话</div>") + "<div id='typing'></div>";
}
function showTyping(){
  $("typing")?.remove();
  const d = document.createElement("div");
  d.id = "typing"; d.className = "typing";
  d.textContent = "皮皮正在想怎么回你……";
  $("chat").appendChild(d);
  $("chat").scrollTop = 0;
}
function showNote(text){
  const d = document.createElement("div");
  d.className = "evt sys";
  d.textContent = "⚠️ " + text;
  $("chat").prepend(d);
}

/* ================= 远程聊天输入 ================= */
function sendChat(){
  const inp = $("chatInput");
  const text = inp.value.trim();
  if (!text || !connected || !ws || ws.readyState !== 1) return;
  ws.send(JSON.stringify({type:"chat", text}));
  inp.value = "";
}
$("chatSend").onclick = sendChat;
$("chatInput").addEventListener("keydown", e => { if (e.key === "Enter") sendChat(); });
</script>
