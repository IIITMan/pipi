# ============================================================
# 皮皮 · 主配置
# ============================================================
# 环境变量可覆盖任何项（前缀 PIPI_，如 PIPI_LLM__API_KEY）。
# ★ 密钥与个性化覆盖写到 configs/local.yaml（已在 .gitignore，优先级最高）。
# 设计文档：docs/LLM_SELECTION.md / ARCHITECTURE.md / HARDWARE.md
# ============================================================

app:
  name: "皮皮"
  data_dir: "./data"
  log_level: "INFO"
  timezone: "Asia/Shanghai"

# ---------------- 用户 ----------------
user:
  default_user_id: "owner"
  adoption_on_first_run: true   # 首次运行皮皮主动问名字（领养仪式）

# ---------------- 天气 ----------------
weather:
  enabled: true
  city: "济南"                  # 默认城市（全局通用：天气查询/意图协议）
  sync_interval_s: 1800         # 真实天气 → 生命模块的同步间隔

# ---------------- 联网搜索 ----------------
search:
  enabled: true
  provider: "auto"              # auto(bing→wikipedia) | bing | wikipedia | mock

# ---------------- 条件预警 ----------------
alerts:
  enabled: true
  report_home: true             # 主人回家 → 汇报今日提醒/异常
  report_stranger: true         # 陌生人当日累计 ≥ stranger_min 次 → 提醒
  home_cooldown_s: 1800
  stranger_cooldown_s: 3600
  stranger_min: 2

# ---------------- 环境档案 ----------------
env:
  enabled: true                 # 家的持续认知（data/environment.json）
  max_arrivals: 14              # 记住最近几次回家钟点，学"几点回来"

# ---------------- 人格 ----------------
persona:
  active: "tsundere"            # tsundere | talkative | clingy | sharp_tongue | jarvis
  personas_dir: "configs/personas"
  hot_reload: true
  bot_name: "皮皮"              # 默认名字（人格 yaml 的 bot_name 会覆盖它）

# ---------------- LLM ----------------
# 选型/价格实算见 docs/LLM_SELECTION.md
llm:
  provider: "doubao"            # qwen | deepseek | doubao | openai | mock
  base_url: "https://ark.cn-beijing.volces.com/api/v3"
  api_key: ""                   # ★ 不写这里：PIPI_LLM__API_KEY 或 local.yaml
  bot_name: "皮皮"
  model: "ep-20261010183308-wqd6d"   # 主对话模型（local.yaml 可覆盖）
  cheap_model: ""               # 留空 = 全部走 model（短句/抽取不单独分档）
  timeout_s: 30
  max_retries: 2
  extra_body:                   # 关深度思考：小任务不被 reasoning 拖到超时
    thinking:
      type: "disabled"
  routing:
    enabled: true               # 短输入走 cheap_model 的分档（cheap 空 = 空转）
    simple_max_chars: 8
  temperature: 0.8              # <0.6 刻板像客服；>1.0 人格会飘

# ---------------- 记忆 ----------------
memory:
  db_path: "data/pipi.db"
  embedder: "auto"              # auto | bge_small | tfidf
  embed_model_path: "data/models/bge-small-zh"
  top_k: 5
  max_per_type: 2               # 同类记忆最多召回几条
  decay_interval_min: 60        # 艾宾浩斯遗忘巡检间隔
  pin_types: ["identity", "commitment"]   # 冷启动直接 pinned
  allow_user_forget: true
  export_enabled: true

# ---------------- 语音 ----------------
# 模式：cascade（ASR→LLM→TTS 串联，当前）| realtime（火山 S2S，待接入）
# hybrid 目标形态见 docs/LLM_SELECTION.md §9；工具调用必须走文本链
audio:
  enabled: true
  sample_rate: 16000
  frame_ms: 30
  mode: "cascade"

  realtime:                     # 端到端 S2S（未接入保持关闭）
    enabled: false
    endpoint: "wss://openspeech.bytedance.com/api/v3/realtime/dialog"
    resource_id: "volc.speech.dialog"
    app_id: ""
    access_token: ""            # PIPI_AUDIO__REALTIME__ACCESS_TOKEN
    voice: "zh_female_vv_jupiter_bigtts"
    persona_instruction: ""     # 运行时由 persona 填充
    observability:
      save_transcript: true
      save_llm_text: true
      moderation: true
    delegate_to_agent: ["记忆写入", "记忆查询", "天气", "云台动作", "回充", "控制指令"]

  asr_chain: ["sensevoice"]     # 唯一方案 sherpa-onnx，无降级
  asr:
    sensevoice:
      sherpa_model_dir: "data/models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17"
      num_threads: 2
      use_itn: false            # 中文数字更自然；要阿拉伯数字再开
      language: "auto"
    cloud_dashscope:
      api_key: ""
      model: "paraformer-realtime-v2"

  tts_chain: ["ark_tts", "edge_tts", "mock"]
  tts:
    ark_tts:                    # 豆包 TTS 2.0（真流式 + 情感演绎）
      api_key: ""               # PIPI_AUDIO__TTS__ARK_TTS__API_KEY 或 local.yaml
      resource_id: "seed-tts-2.0"
      speaker: "zh_female_peiqi_uranus_bigtts"   # 音色 ID（人格 voice_id 可覆盖）
      model: ""                 # 声线复刻时才需指定
      sample_rate: 24000
      bitrate: 160000
      emotion_instruction: true # 按情绪调整语气（不计费）
      cache_enabled: true       # 固定短语（唤醒应答等）本地缓存
      cache_dir: "data/tts_cache"
    edge_tts:
      voice: "zh-CN-XiaoxiaoNeural"

  mic:
    sample_rate: 16000
    silence_rms: auto           # auto=开机校准；或填固定数值
    noise_multiplier: 2.2       # 噪声底 ×2.2 算"在说话"
    min_silence_rms: 120        # 自动阈值下限
    gain: 2.0                   # 声音小调大（2~4），杂音大降回 1
    pre_roll_s: 0.6             # 预录时长，防唤醒词丢字
    silence_tail: 1.2           # 静音多久判"说完"（秒）
    max_seconds: 15
    wake_words: ["皮皮", "pipi"]   # 人格 yaml 的 wake_words 会覆盖它
    sleep_after_s: 30           # 会话安静多久回待唤醒
    vad:                        # sherpa silero_vad（无降级）
      model: "data/models/vad/silero_vad.onnx"
      threshold: 0.5
      min_silence_ms: 600       # 端点检测（600~800 可调）
      min_speech_ms: 250
    kws:                        # sherpa KeywordSpotter（无降级）
      model_dir: "data/models/kws"
      # 唤醒词在 data/models/kws/keywords.txt（拼音 token + @词；仅支持中文）
      keywords_score: 1.0
      keywords_threshold: 0.25
      min_speech_s: 0.3
    voiceprint:                 # 声纹认主（首次说话自动登记）
      enabled: true
      model: "data/models/3dspeaker_speech_eres2net_base_sv_zh-cn_3dspeaker_16k.onnx"
      threshold: 0.5            # ≥ 主人；< reject → 陌生人
      reject_threshold: 0.35
      auto_enroll: true
    session:
      timeout_s: 10             # 会话安静多久回待机
      barge_in: true            # 抢话打断
      barge_in_min_ms: 200
      barge_in_arm_s: 1.0       # 开播后不响应打断的冷却
      barge_in_multiplier: 1.15 # 打断能量倍数（相对说话阈值）
  interrupt:
    enabled: true
    vad_threshold: 0.5
    min_speech_ms: 200

# ---------------- 生命模块 ----------------
# backend: pulse（PULSE 心搏，默认）| legacy（旧 LifeEngine，回退用）
pulse:
  backend: "pulse"
  tick_s: 1.0                   # 心搏 1Hz
  vocal_cooldown_s: 90.0        # 自发开口最小间隔
  vocal_prob: 0.02              # 决策开口概率（克制）
  diary_memory: false

life:
  enabled: true
  personality:
    extraversion: 6.0           # 0~10，越高越爱主动说话
    curiosity_weight: 6.0
    sensitivity: 5.0
    like: ["晚霞", "小故事", "聊天气"]
    dislike: ["巨大噪音", "连续频繁打断"]
  rates:
    physio_hz: 1.0
    thought_hz: 3.0
    scheduler_hz: 2.0
  vocal_cooldown_s: 45.0
  wandering_cooldown_s: 90.0
  thought_ttl_s: 5.0
  social_vocal_threshold: 7.5   # 想找人说话的阈值（越高越稀有）
  perception:                   # 摄像头 → 离散事件（总开关 vision.enabled）
    enabled: true
    fps: 1.0
    debounce_s: 30.0            # 同一事件去重窗口
    stranger_cooldown_s: 300
  energy_min_vocal: 2.5         # 精力低于此不发声
  sleep_energy: 2.5             # 精力低于此切休息
  wandering_enter_s: 45.0
  idle_motion_interval_s: 30.0
  action_backend: "mock"        # mock | ros2
  ws_host: "0.0.0.0"            # 监控推送（web/monitor.html 订阅）
  ws_port: 8848
  chain:                        # 联想链念头
    enabled: true
    chain_prob: 0.01
    chain_cooldown_s: 90.0
    require_idle: true
    min_energy: 3.0
    vocal_prob: 0.3
    max_tokens: 60
    timeout_s: 12.0

# ---------------- 成长系统 ----------------
growth:
  enabled: true
  relationship:
    enabled: true               # 关系阶段机（S1~S4）
    stage_days: [0, 5, 30, 90]
    stage_milestones: [0, 1, 2, 3]
    min_affection_s4: 550
    regress_days: 30
    regress_floor: 2            # 回落不低于 S2
  plasticity:                   # 可塑性曲线（S1 婴儿→S4 成熟）
    curve: [1.0, 0.6, 0.35, 0.15]
    base_step: 0.08
    cap_offset: 3
  expression:                   # 高频表达拾取（模仿学习）
    enabled: true
    min_count: 3
    max_len: 12
    quote_per_session: 2
  milestone:
    enabled: true
    night_well_target: 100      # M6：第 N 次晚安

# ---------------- 提醒 / 闹铃 ----------------
reminders:
  enabled: true
  tick_s: 2.0
  retry_max: 3
  retry_window_s: 120
  default_offset_s: 3600        # 解析不出时间默认 1 小时后
  ack_window_s: 600             # "知道了"可完成最近 10 分钟内的提醒
  quiet_hours: [23, 7]          # 静默窗口（闹铃准点必响）

# ---------------- 视觉 ----------------
vision:
  enabled: true                 # false = 关摄像头（隐私优先）
  camera_index: 0
  fps: 1.5
  capabilities:
    detect: true                # 人脸检测（本地 YuNet）
    follow: true                # 人脸跟随 → 云台转向
    recognize: false            # 认主已由声纹覆盖
    expression: false           # 表情走云端
    clothing: false
  detector: "yunet"             # yunet | mediapipe
  detector_model: "data/models/face_detection_yunet_2023mar.onnx"
  recognizer: "insightface"
  follow_deadzone: 0.12
  follow_cooldown_s: 2.0
  vlm: true                     # 云端多模态识别（画面 + 问题 → 描述）
  vlm_model: ""                 # 留空复用 llm.model；或填支持视觉的接入点
  monitor_stream: true          # 监控页画面推流（只推流不落盘）
  monitor_fps: 0.5
  expression_model: "hsemotion" # hsemotion | fer | none
  face_match_threshold: 0.45
  presence_grace_s: 6.0         # 漏检几帧不算"主人离开"（防抖）
  enroll_dir: "data/faces"
  privacy:
    save_frames: false          # 原始画面不落盘
    save_observations: true
    observation_retention_days: 7

# ---------------- 主动搭话 ----------------
proactive:
  enabled: true
  idle_hours: 2.0               # 多久没交互算"被冷落"
  return_greeting_cooldown_min: 30
  quiet_hours: [23, 7]
  triggers:
    return_home:      { enabled: true, priority: 90 }
    concern_followup: { enabled: true, priority: 85 }
    important_date:   { enabled: true, priority: 80 }
    idle:             { enabled: true, priority: 50 }
    morning:          { enabled: true, priority: 40 }
    night_sleep:      { enabled: true, priority: 40 }
    random:           { enabled: true, priority: 10 }
    low_battery:      { enabled: true, priority: 95 }
  cooldowns:                    # 同类触发的冷却（分钟）
    return_home: 30
    concern_followup: 60
    important_date: 1440
    idle: 180
    morning: 720
    night_sleep: 720
    random: 240
    low_battery: 120

# ---------------- 运动控制（详见 docs/HARDWARE.md）----------------
motion:
  enabled: false                # 软件阶段默认关闭
  provider: "mock"              # mock（纯日志）| wheeltec（轮趣 C30D 实机）
  wheeltec:
    topic_cmd: "/cmd_vel"       # 底盘 Twist 指令
    topic_head: "/pipi/head"    # [head_pan°, head_tilt°, led(0..1)]
    topic_odom: "/odom"
    node_name: "pipi_base"
    max_head_tilt_deg: 45
  gestures_enabled: true
  max_head_pan_deg: 120

# ---------------- 自动回充（详见 docs/CHASSIS.md §12）----------------
charging:
  enabled: false
  trigger:
    battery_low_pct: 0.25
    idle_minutes: 20
    scheduled_time: "23:30"
    respect_quiet_hours: true
  guidance:                     # 远程视觉找桩 + 近程红外对齐
    far: "vision_tag"
    far_max_range_m: 3.0
    near: "ir_array"
    near_enter_range_m: 0.35
    tag_family: "tag36h11"
    tag_id: 0
  align:                        # 三段式对接（P 控制 + 死区）
    vx_kp: 0.80
    vy_kp: 1.20
    wz_kp: 2.00
    lateral_deadband_mm: 8.0
    heading_deadband_deg: 3.0
    distance_deadband_mm: 12.0
    timeout_s: 25.0
    max_retries: 3
  dock:
    charge_voltage_v: 12.6
    charge_current_a: 3.5
    contact_full_s: 3.0
    no_current_fault_s: 10.0
  safety:
    abort_on_human_near: true
    human_near_m: 0.8
    max_dock_speed_mps: 0.15

# ---------------- 可观测性 ----------------
observability:
  trace_enabled: true
  metrics_enabled: true
  save_turns: true
  replay_enabled: true
  llm_log: true                 # LLM 原始请求/响应（data/logs/llm_日期.jsonl）

# ---------------- 交互入口 ----------------
interface:
  cli: true
  web:
    enabled: false              # 遗留（监控用 web/monitor.html + WS 即可）
    host: "0.0.0.0"
    port: 8848
  wake_word:
    enabled: false              # 预留（当前用 sherpa KWS）
    engine: "openwakeword"
    keyword: "皮皮"
