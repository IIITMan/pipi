<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>皮皮 · 情感陪伴机器人</title>
<style>
  :root{
    --bg:#0f1117; --panel:#171a23; --panel-2:#1e2230; --line:#2a2f40;
    --fg:#e8eaf0; --fg-dim:#8b92a8; --accent:#ff6b9d; --accent-2:#7c5cff;
    --up:#ff4d5e; --down:#22c55e; --warn:#f5a524;
    --radius:14px;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:radial-gradient(1200px 600px at 20% -10%,#1b1f2e 0%,var(--bg) 55%);
    color:var(--fg); font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    min-height:100vh;
  }
  header{
    display:flex; align-items:center; gap:14px; padding:14px 22px;
    border-bottom:1px solid var(--line); background:rgba(15,17,23,.85);
    backdrop-filter:blur(12px); position:sticky; top:0; z-index:10;
  }
  .logo{
    width:34px;height:34px;border-radius:10px;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    display:grid;place-items:center;font-weight:700;font-size:15px;color:#fff;
  }
  header h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.5px}
  header .sub{font-size:12px;color:var(--fg-dim)}
  .pills{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .pill{
    font-size:11px;padding:3px 10px;border-radius:999px;
    border:1px solid var(--line);color:var(--fg-dim);background:var(--panel);
  }
  .pill.ok{border-color:#22c55e55;color:#4ade80}
  .pill.no{border-color:#ff4d5e33;color:#f87171}

  .wrap{display:grid;grid-template-columns:1fr 400px;gap:16px;padding:16px;max-width:1500px;margin:0 auto}
  @media(max-width:1080px){.wrap{grid-template-columns:1fr}}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .panel > h2{
    margin:0;padding:11px 15px;font-size:12.5px;font-weight:600;letter-spacing:.4px;
    color:var(--fg-dim);text-transform:uppercase;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:8px;
  }
  .panel > h2 .dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}

  /* ---- 聊天 ---- */
  #chatpanel{display:flex;flex-direction:column;height:calc(100vh - 100px);min-height:520px}
  #log{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
  .msg{display:flex;gap:10px;max-width:88%}
  .msg .av{
    width:28px;height:28px;border-radius:9px;flex:0 0 28px;display:grid;place-items:center;
    font-size:12px;font-weight:700;
  }
  .msg.pipi .av{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff}
  .msg.user{align-self:flex-end;flex-direction:row-reverse}
  .msg.user .av{background:#2b3145;color:var(--fg-dim)}
  .bubble{
    background:var(--panel-2);padding:9px 13px;border-radius:12px;
    border-top-left-radius:3px;white-space:pre-wrap;word-break:break-word;
  }
  .msg.user .bubble{background:#232a3d;border-top-left-radius:12px;border-top-right-radius:3px}
  .bubble.thinking{color:var(--fg-dim);font-style:italic}
  .hint{font-size:11px;color:var(--fg-dim);margin-top:5px;display:flex;gap:6px;flex-wrap:wrap}
  .tag{background:#0e1119;border:1px solid var(--line);border-radius:6px;padding:1px 6px}

  #composer{display:flex;gap:9px;padding:12px;border-top:1px solid var(--line);background:var(--panel)}
  #input{
    flex:1;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;
    color:var(--fg);padding:10px 13px;font:inherit;resize:none;outline:none;max-height:110px;
  }
  #input:focus{border-color:var(--accent-2)}
  button{
    background:linear-gradient(135deg,var(--accent),var(--accent-2));border:0;color:#fff;
    border-radius:10px;padding:10px 17px;font:inherit;font-weight:600;cursor:pointer;
  }
  button:disabled{opacity:.45;cursor:not-allowed}
  button.ghost{background:var(--panel-2);border:1px solid var(--line);color:var(--fg);font-weight:500}

  /* ---- 右栏 ---- */
  .side{display:flex;flex-direction:column;gap:16px;max-height:calc(100vh - 100px);overflow-y:auto}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;padding:13px 15px;font-size:13px}
  .kv .k{color:var(--fg-dim)}
  .kv .v{text-align:right;font-variant-numeric:tabular-nums}

  .bar{height:6px;border-radius:3px;background:#0e1119;overflow:hidden;margin-top:5px;grid-column:1/-1}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .5s}

  ul.mem{list-style:none;margin:0;padding:0;max-height:290px;overflow-y:auto}
  ul.mem li{padding:9px 15px;border-bottom:1px solid var(--line);font-size:12.5px}
  ul.mem li:last-child{border-bottom:0}
  ul.mem .row{display:flex;gap:8px;align-items:baseline}
  ul.mem .type{font-size:10px;padding:1px 7px;border-radius:5px;background:#0e1119;color:var(--fg-dim);border:1px solid var(--line);flex:0 0 auto}
  ul.mem .txt{flex:1;word-break:break-word}
  ul.mem .meta{color:var(--fg-dim);font-size:11px;margin-top:3px;display:flex;gap:9px;align-items:center}
  ul.mem .pin{cursor:pointer;user-select:none}
  ul.mem .del{cursor:pointer;color:#f87171;margin-left:auto}
  ul.mem li.pinned{background:#ff6b9d0d}

  canvas{display:block;width:100%;height:150px}
  .empty{padding:22px 15px;color:var(--fg-dim);font-size:12.5px;text-align:center}
  .row-btns{display:flex;gap:8px;padding:11px 15px;flex-wrap:wrap}
  .row-btns button{font-size:12px;padding:7px 12px}
</style>
</head>
<body>
<header>
  <div class="logo">皮皮</div>
  <div>
    <h1>皮皮 · 情感陪伴机器人</h1>
    <div class="sub" id="subtitle">正在连接…</div>
  </div>
  <div class="pills" id="pills"></div>
</header>

<div class="wrap">
  <!-- 左：对话 -->
  <section class="panel" id="chatpanel">
    <h2><span class="dot"></span>对话</h2>
    <div id="log"></div>
    <div id="composer">
      <textarea id="input" rows="1" placeholder="跟皮皮说点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
      <button id="send">发送</button>
    </div>
  </section>

  <!-- 右：观测台 -->
  <aside class="side">
    <section class="panel">
      <h2><span class="dot"></span>皮皮的状态</h2>
      <div class="kv" id="stats"><div class="k">加载中…</div></div>
    </section>

    <section class="panel">
      <h2><span class="dot"></span>好感度 / 情绪曲线</h2>
      <canvas id="affectionChart"></canvas>
    </section>

    <section class="panel">
      <h2><span class="dot"></span>遗忘曲线（未来 7 天预测）</h2>
      <canvas id="decayChart"></canvas>
    </section>

    <section class="panel">
      <h2><span class="dot"></span>记忆（<span id="memcount">0</span>）</h2>
      <ul class="mem" id="memory"></ul>
      <div class="row-btns">
        <button class="ghost" id="btnDecay">跑一次遗忘巡检</button>
        <button class="ghost" id="btnArrive">模拟「主人回家」</button>
      </div>
    </section>
  </aside>
</div>

<script>
const USER = new URLSearchParams(location.search).get("user") || "owner";
const $ = s => document.querySelector(s);
const log = $("#log");

/* ============ 对话 ============ */
function addMsg(role, text, hint){
  const el = document.createElement("div");
  el.className = "msg " + role;
  el.innerHTML = `<div class="av">${role==="pipi"?"白":"我"}</div>
                  <div><div class="bubble"></div></div>`;
  el.querySelector(".bubble").textContent = text;
  if(hint){
    const h = document.createElement("div");
    h.className = "hint";
    h.innerHTML = hint.map(t => `<span class="tag">${t}</span>`).join("");
    el.querySelector("div:last-child").appendChild(h);
  }
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

let pending = null;
function ensureThinking(){
  if(pending) return pending;
  pending = addMsg("pipi", "…", []);
  pending.querySelector(".bubble").classList.add("thinking");
  return pending;
}

async function send(){
  const box = $("#input");
  const text = box.value.trim();
  if(!text) return;
  box.value = ""; box.style.height = "auto";
  addMsg("user", text);
  $("#send").disabled = true;

  try{
    const res = await fetch("/api/chat", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({user_id: USER, text})
    });
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "", ev = "", data = "";
    let firstBubble = true;

    while(true){
      const {value, done} = await reader.read();
      if(done) break;
      buf += dec.decode(value, {stream:true});
      const lines = buf.split("\n"); buf = lines.pop();
      for(const line of lines){
        if(line.startsWith("event: ")) ev = line.slice(7).trim();
        else if(line.startsWith("data: ")) data = line.slice(6);
        else if(line === "" && ev){
          const payload = data ? JSON.parse(data) : {};
          handleSSE(ev, payload, () => firstBubble);
          if(ev==="bubble") firstBubble = false;
          ev = ""; data = "";
        }
      }
    }
  }catch(e){
    if(pending){ pending.querySelector(".bubble").textContent = "（连不上了…）"; pending=null; }
    else addMsg("pipi","（连不上了…）");
  }finally{
    pending = null;
    $("#send").disabled = false;
    $("#input").focus();
    refreshSide();
  }
}

function handleSSE(ev, d, isFirst){
  if(ev === "meta"){
    const hints = [];
    if(d.memories_used?.length) hints.push(`想起${d.memories_used.length}件事`);
    if(d.emotion) hints.push(d.emotion.mood);
    if(d.degraded) hints.push("已降级");
    pending = null;
    if(hints.length) addMsg("pipi", "", hints);
    else ensureThinking();
    return;
  }
  if(ev === "bubble"){
    if(pending){ pending.remove(); pending = null; }
    addMsg("pipi", d.text);
    return;
  }
  if(ev === "error"){
    if(pending){ pending.querySelector(".bubble").textContent = d.message; pending=null; }
    else addMsg("pipi", "（"+d.message+"）");
  }
}

$("#send").onclick = send;
$("#input").addEventListener("keydown", e => {
  if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(); }
});
$("#input").addEventListener("input", e => {
  e.target.style.height = "auto";
  e.target.style.height = Math.min(110, e.target.scrollHeight) + "px";
});

/* ============ 观测台 ============ */
async function refreshSide(){
  await Promise.all([loadStats(), loadMemories(), loadAffection(), loadDecay()]);
}

async function loadStats(){
  const r = await fetch(`/api/state?user_id=${USER}`).then(x=>x.json());
  const s = r.stats, p = r.profile;
  const pct = Math.max(0, Math.min(100, s.affection/10));
  $("#stats").innerHTML = `
    <div class="k">当前情绪</div><div class="v">${s.mood} · ${s.intensity}</div>
    <div class="k">好感度</div><div class="v">${s.affection}（${s.affection_level}）</div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="k">想被陪着</div><div class="v">${s.companion_need}</div>
    <div class="k">认主</div><div class="v">${p.is_owner ? (p.call_name||p.nickname||"是") : "还不是主人"}</div>
    <div class="k">本轮会话</div><div class="v">${s.session_turns} 句</div>`;
}

async function loadMemories(){
  const r = await fetch(`/api/memories?user_id=${USER}`).then(x=>x.json());
  $("#memcount").textContent = r.count;
  const ul = $("#memory");
  if(!r.count){ ul.innerHTML = `<div class="empty">还没有记忆<br>多聊聊，皮皮会记住你的</div>`; return; }
  ul.innerHTML = r.items.map(m => `
    <li class="${m.pinned?"pinned":""}">
      <div class="row">
        <span class="type">${m.type}</span>
        <span class="txt">${esc(m.content)}</span>
        <span class="pin" onclick="togglePin('${m.id}', ${!m.pinned})" title="钉住=永不遗忘">${m.pinned?"📌":"📍"}</span>
        <span class="del" onclick="delMem('${m.id}')" title="删除">✕</span>
      </div>
      <div class="meta">
        <span>显著 ${m.salience}</span>
        <span>半衰期 ${m.half_life_hours===null?"永不":m.half_life_hours+"h"}</span>
        <span>想起 ${m.access_count} 次</span>
      </div>
    </li>`).join("");
}
const esc = t => t.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

window.togglePin = async (id, pinned) => {
  await fetch(`/api/memories/${id}/pin`, {method:"POST",
    headers:{"Content-Type":"application/json"}, body:JSON.stringify({pinned})});
  loadMemories();
};
window.delMem = async id => {
  await fetch(`/api/memories/${id}`, {method:"DELETE"});
  loadMemories();
};

function drawLine(canvas, series, opts){
  const dpr = devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w*dpr; canvas.height = h*dpr;
  const c = canvas.getContext("2d"); c.scale(dpr,dpr);
  c.clearRect(0,0,w,h);

  const pad = {l:34,r:10,t:12,b:20};
  const iw = w-pad.l-pad.r, ih = h-pad.t-pad.b;
  const all = series.flatMap(s=>s.pts.map(p=>p.y));
  const ymin = opts.ymin ?? Math.min(...all, 0);
  const ymax = opts.ymax ?? Math.max(...all, 1);
  const xmax = Math.max(...series.flatMap(s=>s.pts.map(p=>p.x)), 1);

  // 网格
  c.strokeStyle = "#2a2f40"; c.lineWidth = 1;
  for(let i=0;i<=3;i++){
    const y = pad.t + ih*i/3;
    c.beginPath(); c.moveTo(pad.l,y); c.lineTo(pad.l+iw,y); c.stroke();
    c.fillStyle = "#8b92a8"; c.font = "10px sans-serif"; c.textAlign="right";
    const val = ymax - (ymax-ymin)*i/3;
    c.fillText(opts.fmtY ? opts.fmtY(val) : val.toFixed(1), pad.l-5, y+3);
  }

  series.forEach(s => {
    c.strokeStyle = s.color; c.lineWidth = 2; c.beginPath();
    s.pts.forEach((p,i) => {
      const x = pad.l + iw*(p.x/xmax);
      const y = pad.t + ih*(1-(p.y-ymin)/(ymax-ymin||1));
      i ? c.lineTo(x,y) : c.moveTo(x,y);
    });
    c.stroke();
    if(s.fill){
      c.lineTo(pad.l+iw, pad.t+ih); c.lineTo(pad.l, pad.t+ih); c.closePath();
      const g = c.createLinearGradient(0,pad.t,0,pad.t+ih);
      g.addColorStop(0, s.color+"55"); g.addColorStop(1, s.color+"00");
      c.fillStyle = g; c.fill();
    }
  });

  c.fillStyle = "#8b92a8"; c.font = "10px sans-serif"; c.textAlign="left";
  c.fillText(opts.xLabel||"", pad.l, h-4);
}

async function loadAffection(){
  const r = await fetch(`/api/affection_curve?user_id=${USER}`).then(x=>x.json());
  const pts = r.points;
  if(pts.length < 2){
    $("#affectionChart").getContext("2d").clearRect(0,0,9999,9999);
    return;
  }
  const t0 = pts[0].t, tn = pts[pts.length-1].t || t0+1;
  drawLine($("#affectionChart"), [{
    color:"#ff6b9d", fill:true,
    pts: pts.map(p => ({x:p.t-t0, y:p.affection}))
  }], {fmtY:v=>v.toFixed(0), xLabel:"时间 →"});
}

async function loadDecay(){
  const r = await fetch(`/api/decay_curve?user_id=${USER}`).then(x=>x.json());
  const cs = r.curves || [];
  if(!cs.length){
    $("#decayChart").getContext("2d").clearRect(0,0,9999,9999);
    return;
  }
  const palette = ["#ff6b9d","#7c5cff","#22d3ee","#f5a524","#4ade80","#f87171"];
  const series = cs.slice(0,6).map((c,i) => ({
    color: palette[i%palette.length], fill: i===0,
    pts: c.points.map(p => ({x:p.h, y:p.s}))
  }));
  drawLine($("#decayChart"), series,
    {ymin:0, ymax:Math.max(...cs.slice(0,6).flatMap(c=>c.points.map(p=>p.s)))*1.05,
     fmtY:v=>v.toFixed(2), xLabel:"未来小时数 →"});
}

/* ============ 主动 / 巡检 ============ */
$("#btnArrive").onclick = async () => {
  const r = await fetch("/api/proactive", {method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({user_id:USER, simulate_arrival:true, clothing:"灰色", expression:"happy"})
  }).then(x=>x.json());
  if(!r.fired){ addMsg("pipi","",[`（没有开口：${r.reason}）`]); return; }
  addMsg("pipi","",[`[主动·${r.trigger}]`]);
  for(const b of r.bubbles) addMsg("pipi", b.text);
  refreshSide();
};

$("#btnDecay").onclick = async () => {
  const r = await fetch("/api/decay", {method:"POST",
    headers:{"Content-Type":"application/json"}, body:JSON.stringify({user_id:USER})
  }).then(x=>x.json());
  addMsg("pipi","",[`遗忘巡检：检查${r.checked} 衰减${r.decayed} 遗忘${r.forgotten} 保留${r.pinned_kept}`]);
  refreshSide();
};

/* ============ 初始化 ============ */
async function init(){
  const h = await fetch("/api/health").then(x=>x.json());
  document.querySelector(".sub").textContent =
    `${h.persona_name}人格 · ${h.llm} · 向量 ${h.embedder}${h.sim_mode?" · 模拟模式":""}`;

  const pills = [];
  for(const [cap, chain] of Object.entries(h.chains)){
    const ok = (h.matrix[cap+":"+chain[chain.length-1]] || false) ||
               chain.some(n => h.matrix[cap+":"+n]);
    const chosen = chain.find(n => h.matrix[cap+":"+n]) || "—";
    pills.push(`<span class="pill ${ok?'ok':'no'}">${cap}: ${chosen}</span>`);
  }
  $("#pills").innerHTML = pills.join("");
  refreshSide();
  addMsg("pipi","",["皮皮已经在这儿了，说句话吧"]);
  $("#input").focus();
}
init();
setInterval(refreshSide, 15000);
</script>
</body>
</html>
